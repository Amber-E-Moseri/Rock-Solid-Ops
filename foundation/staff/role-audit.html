<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Solid - Role Audit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../ui/premium-theme.css" />
  <link rel="stylesheet" href="../ui/admin-shell.css" />
  <link rel="stylesheet" href="../ui/components.css" />
  <link rel="stylesheet" href="../ui/layout.css" />
  <link rel="stylesheet" href="../ui/primitives.css" />
  <style>
    :root {
      --primary-hover: #7d62c8;
      --shadow-soft: 0 2px 8px rgba(0,0,0,.08);
      --shadow: 0 4px 16px rgba(0,0,0,.1);
      --shadow-pop: 0 8px 24px rgba(0,0,0,.14);
      --warning: var(--warn, #c07400);
      --warning-bg: var(--warn-bg, #fff8e6);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Manrope", sans-serif; color: var(--text); background: radial-gradient(900px 460px at 100% -12%, rgba(244,190,65,.10), transparent 65%), radial-gradient(760px 380px at -10% -6%, rgba(91,63,165,.08), transparent 64%), var(--bg); min-height: 100dvh; }
    .page-hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .page-hd h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px; }
    .page-hd-sub { color: var(--muted); font-size: 14px; font-weight: 500; margin: 0; }
    .page-hd-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    /* KPI tiles — JS renders summary-card/label/value into dash-kpis grid */
    .dash-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    @media (max-width: 700px) { .dash-kpis { grid-template-columns: repeat(2, 1fr); } }
    .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow-soft); }
    .summary-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
    .summary-value { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; color: var(--text); line-height: 1; }
    .tab-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .tab { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 14px; font: 600 13px/1.4 inherit; cursor: pointer; transition: background .12s, border-color .12s; }
    .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 14px rgba(76,42,146,.22); }
    .tab:hover:not(.active) { background: var(--surface-2); }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-soft); overflow: hidden; margin-bottom: 16px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .role-chip { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 700; }
    .role-superadmin { background: #fef3c7; color: #92400e; }
    .role-admin { background: #ede9fe; color: #5b21b6; }
    .role-pastor { background: #d1fae5; color: #065f46; }
    .role-principal { background: #dbeafe; color: #1e40af; }
    .role-teacher { background: #e0f2fe; color: #0c4a6e; }
    .role-subgroup_admin { background: #fce7f3; color: #9d174d; }
    .role-other { background: var(--surface-2); color: var(--muted); }
    .inactive-row td { opacity: 0.55; }
    .btn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; font: 600 13px/1.4 inherit; background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap; transition: background .12s, box-shadow .12s; }
    .btn:hover { background: var(--surface-2); box-shadow: var(--shadow-soft); }
    .btn-primary { background: linear-gradient(140deg, var(--primary-hover), var(--primary)); color: #fff; border-color: var(--primary); box-shadow: 0 4px 14px rgba(76,42,146,.22); }
    .btn-danger  { background: var(--danger-bg); color: var(--danger); border-color: color-mix(in srgb,var(--danger) 30%,transparent); }
    .btn-success { background: var(--success-bg); color: var(--success); border-color: color-mix(in srgb,var(--success) 30%,transparent); }
    .inline-role { display: flex; align-items: center; gap: 6px; }
    .role-select { border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; font: inherit; font-size: 13px; background: var(--surface); }
    .msg { padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); font-size: 14px; }
    .msg.error   { border-color: color-mix(in srgb,var(--danger) 30%,transparent); background: var(--danger-bg); color: var(--danger); }
    .msg.success { border-color: color-mix(in srgb,var(--success) 30%,transparent); background: var(--success-bg); color: var(--success); }
    .fs-table-wrap { overflow: auto; }
    .fs-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .fs-table thead tr { background: var(--surface-2); }
    .fs-table th { padding: 10px 13px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--border); }
    .fs-table td { padding: 11px 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .fs-table tbody tr:last-child td { border-bottom: none; }
    .fs-table tbody tr:hover { background: color-mix(in srgb,var(--primary) 4%,transparent); }
    @media (max-width:900px) { .fs-table-wrap { display:none; } .mobile-cards { display:grid !important; } }
    .mobile-cards { display: none; gap: 10px; }
    .mobile-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px; background: var(--surface); box-shadow: var(--shadow-soft); }
  </style>
</head>
<body>
  <main class="fs-page fs-wrap-xl">
    <div class="page-hd">
      <div>
        <h1>Role Audit</h1>
        <p class="page-hd-sub">Review and manage user roles and permissions across the system.</p>
      </div>
      <div class="page-hd-actions">
        <button id="refreshBtn" class="btn">Refresh</button>
      </div>
    </div>

    <div class="dash-kpis" id="summaryGrid"></div>

    <div class="tab-bar" id="tabBar">
      <button class="tab active" data-tab="all">All</button>
      <button class="tab" data-tab="admin">Admins</button>
      <button class="tab" data-tab="teacher">Teachers</button>
      <button class="tab" data-tab="pastor">Pastors</button>
      <button class="tab" data-tab="pending">Pending</button>
      <button class="tab" data-tab="inactive">Inactive</button>
    </div>

    <div class="panel">
      <div class="toolbar">
        <input class="fs-input" id="searchInput" type="search" placeholder="Search name or email" style="flex:1;min-width:200px" />
      </div>

      <div id="flashArea" style="padding:10px 16px"></div>

      <div class="fs-table-wrap">
        <table class="fs-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Active</th>
              <th>Joined</th>
              <th>Last Updated</th>
              <th>Teacher Record</th>
              <th>Linked Classes</th>
              <th id="actionsHeader" style="display:none">Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="mobile-cards" id="mobileCards"></div>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/admin-shell.js?v=20260518"></script>
  <script type="module">
    import { supabase, requireAuth } from "../auth/auth-client.js";

    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? "").replace(/[&<>'"]/g, (m) => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[m]));
    const fmtDate = (v) => v ? new Date(v).toLocaleDateString("en-CA", { year:"numeric", month:"short", day:"numeric" }) : "-";

    const ALL_ROLES = ["superadmin","admin","pastor","principal","subgroup_admin","teacher","student","pending"];

    const state = {
      profiles: [],
      teachers: [],
      classCounts: {},
      profile: null,
      activeTab: "all",
      isSuperadmin: false,
    };

    function showFlash(msg, type = "success") {
      $("flashArea").innerHTML = msg ? `<div class="msg ${type}">${esc(msg)}</div>` : "";
      if (msg && type !== "error") setTimeout(() => { $("flashArea").innerHTML = ""; }, 4000);
    }

    function roleChip(role) {
      const r = String(role || "other").toLowerCase();
      const cls = `role-chip role-${ALL_ROLES.includes(r) ? r : "other"}`;
      return `<span class="${cls}">${esc(role || "â€”")}</span>`;
    }

    function filteredProfiles() {
      const q   = ($("searchInput")?.value || "").toLowerCase().trim();
      const tab = state.activeTab;

      return state.profiles.filter((p) => {
        const role = (p.role || "").toLowerCase();
        if (tab === "admin"    && !["admin","superadmin"].includes(role)) return false;
        if (tab === "teacher"  && role !== "teacher") return false;
        if (tab === "pastor"   && !["pastor","principal"].includes(role)) return false;
        if (tab === "pending"  && role !== "pending") return false;
        if (tab === "inactive" && p.is_active !== false) return false;
        if (q) {
          const pool = [p.full_name, p.email].join(" ").toLowerCase();
          if (!pool.includes(q)) return false;
        }
        return true;
      });
    }

    function renderSummary() {
      const ps = state.profiles;
      const admins   = ps.filter((p) => ["admin","superadmin"].includes((p.role||"").toLowerCase())).length;
      const teachers = ps.filter((p) => (p.role||"").toLowerCase() === "teacher").length;
      const pastors  = ps.filter((p) => ["pastor","principal"].includes((p.role||"").toLowerCase())).length;
      const pending  = ps.filter((p) => (p.role||"").toLowerCase() === "pending").length;
      const inactive = ps.filter((p) => p.is_active === false).length;

      $("summaryGrid").innerHTML = [
        ["Total Users",  ps.length],
        ["Admins",       admins],
        ["Teachers",     teachers],
        ["Pastors",      pastors],
        ["Pending",      pending],
        ["Inactive",     inactive],
      ].map(([lbl, val]) => `
        <article class="summary-card">
          <div class="summary-label">${esc(lbl)}</div>
          <div class="summary-value">${val}</div>
        </article>
      `).join("");
    }

    function renderTable() {
      const rows   = filteredProfiles();
      const tbody  = $("tableBody");
      const cards  = $("mobileCards");
      const showAct = state.isSuperadmin;

      $("actionsHeader").style.display = showAct ? "" : "none";

      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="${showAct?9:8}"><div class="msg">No users match the current filters.</div></td></tr>`;
        cards.innerHTML = `<div class="msg">No users found.</div>`;
        return;
      }

      tbody.innerHTML = rows.map((p) => {
        const hasTeacher = state.teachers.some((t) => (t.email||"").toLowerCase() === (p.email||"").toLowerCase());
        const classCount = state.classCounts[p.email] || 0;
        const inactive   = p.is_active === false;
        const roleSelect = showAct ? `
          <div class="inline-role">
            <select class="role-select" data-action="changerole" data-uid="${esc(p.id)}" data-email="${esc(p.email)}">
              ${ALL_ROLES.map((r) => `<option value="${r}"${r===p.role?" selected":""}>${r}</option>`).join("")}
            </select>
          </div>` : roleChip(p.role);

        const actBtns = showAct ? `
          <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">
            ${inactive
              ? `<button class="fs-btn btn-success" data-action="activate" data-uid="${esc(p.id)}" data-email="${esc(p.email)}">Activate</button>`
              : `<button class="fs-btn btn-danger"  data-action="deactivate" data-uid="${esc(p.id)}" data-email="${esc(p.email)}">Deactivate</button>`}
          </div>` : "";

        return `<tr class="${inactive?"inactive-row":""}">
          <td><strong>${esc(p.full_name || "â€”")}</strong></td>
          <td style="font-size:12px">${esc(p.email || "â€”")}</td>
          <td>${roleSelect}</td>
          <td style="font-size:12px">${p.is_active === false ? "No" : "Yes"}</td>
          <td style="font-size:12px">${fmtDate(p.created_at)}</td>
          <td style="font-size:12px">${fmtDate(p.updated_at)}</td>
          <td style="font-size:12px">${hasTeacher ? "Yes" : "â€”"}</td>
          <td style="font-size:12px">${classCount > 0 ? classCount : "â€”"}</td>
          ${showAct ? `<td>${actBtns}</td>` : ""}
        </tr>`;
      }).join("");

      cards.innerHTML = rows.map((p) => {
        const inactive = p.is_active === false;
        return `<article class="mobile-card${inactive?" inactive-row":""}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div>
              <strong>${esc(p.full_name || "â€”")}</strong>
              <div style="font-size:12px;color:var(--muted)">${esc(p.email || "â€”")}</div>
            </div>
            ${roleChip(p.role)}
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:6px">Joined ${fmtDate(p.created_at)} Â· ${p.is_active===false?"Inactive":"Active"}</div>
          ${state.isSuperadmin ? `<div style="display:flex;gap:4px;margin-top:8px;flex-wrap:wrap">
            <select class="role-select" data-action="changerole" data-uid="${esc(p.id)}" data-email="${esc(p.email)}" style="flex:1;min-width:100px">
              ${ALL_ROLES.map((r) => `<option value="${r}"${r===p.role?" selected":""}>${r}</option>`).join("")}
            </select>
            ${inactive
              ? `<button class="fs-btn btn-success" data-action="activate"   data-uid="${esc(p.id)}" data-email="${esc(p.email)}">Activate</button>`
              : `<button class="fs-btn btn-danger"  data-action="deactivate" data-uid="${esc(p.id)}" data-email="${esc(p.email)}">Deactivate</button>`}
          </div>` : ""}
        </article>`;
      }).join("");
    }

    async function handleAction(action, uid, email, newRole) {
      const now = new Date().toISOString();
      const actor = state.profile?.email || null;

      if (action === "changerole") {
        if (!newRole) return;
        const { error } = await supabase.from("profiles").update({ role: newRole, updated_at: now }).eq("id", uid);
        if (error) { showFlash(`Role change failed: ${error.message}`, "error"); return; }
        await supabase.from("audit_logs").insert({
          action: "ROLE_CHANGED", entity_type: "user", entity_id: uid,
          actor_email: actor, status: "SUCCESS",
          details: { email, new_role: newRole }, created_at: now,
        });
        const p = state.profiles.find((x) => x.id === uid);
        if (p) p.role = newRole;
        showFlash(`Role updated to "${newRole}" for ${email}.`);
        renderTable();
      }

      if (action === "deactivate") {
        const { error } = await supabase.from("profiles").update({ is_active: false, updated_at: now }).eq("id", uid);
        if (error) { showFlash(`Deactivate failed: ${error.message}`, "error"); return; }
        await supabase.from("audit_logs").insert({
          action: "USER_DEACTIVATED", entity_type: "user", entity_id: uid,
          actor_email: actor, status: "SUCCESS",
          details: { email }, created_at: now,
        });
        const p = state.profiles.find((x) => x.id === uid);
        if (p) p.is_active = false;
        showFlash(`${email} deactivated.`);
        renderTable();
      }

      if (action === "activate") {
        const { error } = await supabase.from("profiles").update({ is_active: true, updated_at: now }).eq("id", uid);
        if (error) { showFlash(`Activate failed: ${error.message}`, "error"); return; }
        await supabase.from("audit_logs").insert({
          action: "USER_ACTIVATED", entity_type: "user", entity_id: uid,
          actor_email: actor, status: "SUCCESS",
          details: { email }, created_at: now,
        });
        const p = state.profiles.find((x) => x.id === uid);
        if (p) p.is_active = true;
        showFlash(`${email} reactivated.`);
        renderTable();
      }
    }

    async function loadData() {
      showFlash("Loading...");
      const [profilesRes, teachersRes] = await Promise.all([
        supabase.from("profiles").select("id,full_name,email,role,is_active,created_at,updated_at").order("created_at", { ascending: false }).limit(2000),
        supabase.from("teachers").select("email,class_option_id").limit(2000),
      ]);

      state.profiles = profilesRes.data || [];
      state.teachers = teachersRes.data || [];

      // Count linked classes per teacher email
      state.classCounts = {};
      for (const t of state.teachers) {
        if (t.email && t.class_option_id) {
          state.classCounts[t.email] = (state.classCounts[t.email] || 0) + 1;
        }
      }

      showFlash("");
      renderSummary();
      renderTable();
    }

    function bindEvents() {
      $("refreshBtn").addEventListener("click", loadData);
      $("searchInput").addEventListener("input", renderTable);

      $("tabBar").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-tab]");
        if (!btn) return;
        state.activeTab = btn.dataset.tab;
        $("tabBar").querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t === btn));
        renderTable();
      });

      // Role select and action buttons â€” event delegation
      document.addEventListener("change", async (e) => {
        const sel = e.target.closest("select[data-action='changerole']");
        if (!sel) return;
        if (!state.isSuperadmin) return;
        await handleAction("changerole", sel.dataset.uid, sel.dataset.email, sel.value);
      });

      document.addEventListener("click", async (e) => {
        const btn = e.target.closest("button[data-action][data-uid]");
        if (!btn || !state.isSuperadmin) return;
        btn.disabled = true;
        await handleAction(btn.dataset.action, btn.dataset.uid, btn.dataset.email);
        btn.disabled = false;
      });
    }

    async function boot() {
      if (!window.FS_CONFIG?.SUPABASE_URL) {
        window.FSAdminShell?.mount({ active: "roleaudit", pageTitle: "Role Audit", profileName: "Not connected" });
        showFlash("Not connected â€” open via live server with config.js", "error");
        return;
      }
      const auth = await requireAuth(["superadmin"]);
      if (!auth) return;
      state.profile     = auth.profile;
      state.isSuperadmin = (auth.profile?.role || "").toLowerCase() === "superadmin";

      window.FSAdminShell?.mount({ active: "roleaudit", pageTitle: "Role Audit", role: auth.profile?.role });

      bindEvents();
      await loadData();
    }

    boot().catch((e) => showFlash(`Boot failed: ${esc(e?.message || e)}`, "error"));
  </script>
</body>
</html>
