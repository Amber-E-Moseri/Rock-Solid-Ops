<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rock Solid — Student Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../ui/premium-theme.css" />
  <link rel="stylesheet" href="../ui/admin-shell.css" />
  <link rel="stylesheet" href="../ui/components.css" />
  <link rel="stylesheet" href="../ui/layout.css" />
  <style>
    /* ── Page chrome ─────────────────────────────────────────── */
    .canvas { padding: 24px 26px 60px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 18px; flex-wrap: wrap; }
    .page-head h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; margin: 0; }
    .page-head p  { color: var(--muted); margin: 6px 0 0; font-size: 14px; font-weight: 500; max-width: 560px; }

    /* ── Panel ───────────────────────────────────────────────── */
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg, 12px); box-shadow: var(--shadow-soft); overflow: hidden; }
    .panel-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface-2, #faf7f2); }
    .panel-head h3 { font-size: 14px; font-weight: 800; margin: 0; }
    .panel-body { padding: 18px 20px; }

    /* ── Setup row ───────────────────────────────────────────── */
    .setup-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .setup-field { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 5px; }
    .setup-field label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .setup-field input, .setup-field select { font-family: inherit; font-size: 13.5px; font-weight: 600; padding: 9px 11px; border-radius: var(--r-md, 8px); border: 1px solid var(--border); background: var(--surface-2, #faf7f2); color: var(--text); transition: border-color .14s, box-shadow .14s; width: 100%; }
    .setup-field input:focus, .setup-field select:focus { outline: none; border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 14%, transparent); }
    .setup-field input:disabled, .setup-field select:disabled { opacity: .55; cursor: not-allowed; }

    /* ── Dropdown ────────────────────────────────────────────── */
    .dropdown { position: relative; }
    .drop-list { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md, 8px); box-shadow: 0 8px 28px rgba(0,0,0,.14); z-index: 50; max-height: 240px; overflow-y: auto; }
    .drop-list.hidden { display: none; }
    .drop-item { padding: 10px 13px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .1s; }
    .drop-item:hover { background: var(--surface-2, #faf7f2); }
    .drop-item-sub { font-size: 11px; color: var(--muted); font-weight: 500; margin-top: 2px; }

    /* ── Buttons ─────────────────────────────────────────────── */
    .btn { display: inline-flex; align-items: center; gap: 5px; padding: 9px 16px; border-radius: var(--r-md, 8px); border: 1px solid var(--border); background: var(--surface); color: var(--text); font: 700 13.5px/1 "Manrope", sans-serif; cursor: pointer; white-space: nowrap; transition: box-shadow .14s, background .12s; }
    .btn:hover { background: var(--surface-2, #faf7f2); box-shadow: var(--shadow-soft); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(140deg, var(--primary-hover, #7d62c8), var(--primary, #4C2A92)); color: #fff; border-color: var(--primary); box-shadow: 0 4px 14px rgba(76,42,146,.22); }
    .btn-primary:hover { box-shadow: 0 6px 20px rgba(76,42,146,.32); }
    .fs-btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: var(--r-md, 8px); border: 1px solid var(--border); background: var(--surface); color: var(--text); font: 700 12.5px/1 "Manrope", sans-serif; cursor: pointer; transition: box-shadow .14s, background .12s; }
    .fs-btn:hover { background: var(--surface-2, #faf7f2); }

    /* ── Error message ───────────────────────────────────────── */
    .error-msg { margin-top: 10px; padding: 10px 14px; border-radius: var(--r-md, 8px); background: var(--danger-bg); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); color: var(--danger); font-size: 13px; font-weight: 600; }
    .state-msg { text-align: center; padding: 28px; color: var(--muted); font-size: 13px; font-weight: 600; }

    /* ── Toolbar ─────────────────────────────────────────────── */
    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--surface-2, #faf7f2); }
    .search-wrap input { font-family: inherit; font-size: 13px; font-weight: 600; padding: 8px 11px; border-radius: var(--r-md, 8px); border: 1px solid var(--border); background: var(--surface); color: var(--text); width: 200px; }
    .search-wrap input:focus { outline: none; border-color: var(--primary); }

    /* ── View toggle ─────────────────────────────────────────── */
    .view-toggle-wrap { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 3px; gap: 2px; box-shadow: var(--shadow-soft); }
    .view-toggle-btn { border: none; border-radius: 9px; padding: 7px 16px; font-size: 12.5px; font-weight: 700; font-family: inherit; cursor: pointer; background: transparent; color: var(--muted); transition: background .15s, color .15s, box-shadow .15s; }
    .view-toggle-btn.active { background: var(--surface-2, #faf7f2); color: var(--primary); box-shadow: 0 1px 4px rgba(76,42,146,.14); }

    /* ── At-risk chip ────────────────────────────────────────── */
    .at-risk-chip { border: 1px solid var(--border); border-radius: var(--r-full, 9999px); padding: 7px 14px; font-size: 12.5px; font-weight: 700; font-family: inherit; cursor: pointer; background: var(--surface-2, #faf7f2); color: var(--muted); transition: background .15s, color .15s, border-color .15s; }
    .at-risk-chip.active { background: var(--danger); color: #fff; border-color: var(--danger); }
    .at-risk-chip:hover:not(.active) { background: var(--danger-bg); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }

    /* ── Legend ──────────────────────────────────────────────── */
    .legend { display: flex; gap: 16px; padding: 10px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .leg { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
    .leg-dot { width: 14px; height: 14px; border-radius: 4px; }

    /* ── Stats strip ─────────────────────────────────────────── */
    .stats-strip { padding: 8px 18px; border-bottom: 1px solid var(--border); background: var(--surface-2, #faf7f2); }
    .stats-inline { display: flex; flex-wrap: wrap; align-items: center; gap: 0; font-size: 12px; color: var(--text-2); }
    .stats-inline .sep { padding: 0 8px; opacity: .6; }

    /* ── Table ───────────────────────────────────────────────── */
    .tbl-outer { overflow-x: auto; }
    #progress-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    #progress-table thead th { padding: 10px 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-2, #faf7f2); border-bottom: 1px solid var(--border); text-align: center; min-width: 52px; }
    #progress-table tbody td { padding: 8px 4px; border-bottom: 1px solid var(--border); text-align: center; vertical-align: middle; }
    #progress-table tbody tr:last-child td { border-bottom: none; }
    #progress-table tbody tr:hover { background: var(--surface-2, #faf7f2); }

    /* ── Sticky name column ──────────────────────────────────── */
    thead th.name-col { text-align: left; padding-left: 16px; padding-right: 12px; position: sticky; left: 0; z-index: 6; background: var(--surface-2, #faf7f2); border-right: 1px solid var(--border); min-width: 180px; }
    thead th.session-hdr { padding: 10px 8px; min-width: 52px; }
    thead tr.group-row th { padding: 6px 0; border-bottom: none; font-size: .65rem; letter-spacing: .08em; text-transform: uppercase; background: color-mix(in srgb, var(--primary) 8%, var(--surface-2)); color: var(--primary); font-weight: 800; }
    thead tr.group-row th.name-col { background: color-mix(in srgb, var(--primary) 8%, var(--surface-2)); color: transparent; }
    td.name-col { position: sticky; left: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 8px 12px 8px 16px; text-align: left; z-index: 2; }
    td.name-col:hover { background: var(--surface-2, #faf7f2); }

    /* ── Student cell ────────────────────────────────────────── */
    .student-name { font-weight: 700; font-size: .88rem; color: var(--text); white-space: nowrap; }
    .student-id   { font-size: .72rem; color: var(--muted); margin-top: 1px; font-weight: 500; }
    .faith-badges { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
    .faith-badges .fs-badge { font-size: 10px; font-weight: 700; line-height: 1; padding: 4px 7px; border-radius: var(--r-full, 9999px); border: 1px solid transparent; display: inline; }
    .fs-badge--success { background: rgba(16,185,129,.14); color: #065f46; border-color: rgba(16,185,129,.35); }
    .fs-badge--warning { background: rgba(245,158,11,.14); color: #92400e; border-color: rgba(245,158,11,.36); }
    .fs-badge--danger  { background: rgba(239,68,68,.12); color: #991b1b; border-color: rgba(239,68,68,.34); }
    .fs-badge--neutral { background: rgba(76,42,146,.10); color: #4C2A92; border-color: rgba(76,42,146,.26); }

    /* ── Attendance checkbox ─────────────────────────────────── */
    .cb-cell { width: 52px; }
    .cb { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--border); display: inline-flex; align-items: center; justify-content: center; transition: all .15s; cursor: default; flex-shrink: 0; }
    .cb.checked   { background: var(--primary); border-color: var(--primary); }
    .cb.unchecked { background: var(--surface); border-color: var(--border); }
    .cb svg { display: none; }
    .cb.checked svg { display: block; }

    /* ── Progress bar ────────────────────────────────────────── */
    .prog-wrap { display: flex; align-items: center; gap: 8px; }
    .prog-bar  { flex: 1; height: 7px; border-radius: var(--r-full, 9999px); background: var(--surface-2, #faf7f2); overflow: hidden; border: 1px solid var(--border); min-width: 60px; }
    .prog-fill { height: 100%; border-radius: var(--r-full, 9999px); background: linear-gradient(90deg, var(--primary-hover, #7d62c8), var(--primary, #4C2A92)); transition: width .2s; }
    .prog-pct  { font-size: 11px; font-weight: 800; color: var(--text-2); white-space: nowrap; min-width: 32px; text-align: right; }

    /* ── Grid note ───────────────────────────────────────────── */
    .grid-note { font-size: 12px; color: var(--muted); padding: 6px 18px; border-bottom: 1px solid var(--border); }

    /* ── Spinner ─────────────────────────────────────────────── */
    .spinner { width: 18px; height: 18px; border: 2.5px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .6s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Hidden ──────────────────────────────────────────────── */
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="main">
    <div class="canvas">

      <div class="page-head">
        <div>
          <h1>Student Progress</h1>
          <p>Class attendance and milestone grid — read-only attendance view from student records.</p>
        </div>
      </div>

      <!-- ── Setup panel ────────────────────────────────────── -->
      <div class="panel" style="margin-bottom:16px">
        <div class="panel-head">
          <h3>Teacher &amp; Class</h3>
        </div>
        <div class="panel-body">
          <div class="setup-row">
            <!-- Teacher search -->
            <div class="setup-field dropdown" style="flex:2;min-width:200px">
              <label>Teacher</label>
              <input id="teacherQuery" placeholder="Search by name or ID…" oninput="onTeacherInput()" autocomplete="off" />
              <div class="drop-list hidden" id="teacherDrop"></div>
            </div>

            <!-- Class select -->
            <div class="setup-field" style="flex:2;min-width:200px">
              <label>Class</label>
              <select id="classSelect" disabled>
                <option value="">— select teacher first —</option>
              </select>
            </div>

            <div class="setup-field" style="flex:0;min-width:auto">
              <label>&nbsp;</label>
              <button class="btn btn-primary" id="loadBtn" onclick="loadGrid()" disabled>Load Students</button>
            </div>
          </div>
          <div id="setup-error"></div>
        </div>
      </div>

      <!-- ── Grid panel ──────────────────────────────────────── -->
      <div class="panel hidden" id="grid-card">

        <!-- Toolbar -->
        <div class="toolbar">
          <div class="view-toggle-wrap">
            <button type="button" id="toggle-classes" class="view-toggle-btn" onclick="setView('classes')">Classes</button>
            <button type="button" id="toggle-milestones" class="view-toggle-btn" onclick="setView('milestones')">Milestones</button>
          </div>
          <div class="search-wrap">
            <input id="studentSearch" placeholder="Filter students…" oninput="filterTable()" autocomplete="off" />
          </div>
          <div style="display:flex;gap:6px;margin-left:auto;align-items:center">
            <button id="atRiskChip" type="button" class="at-risk-chip" onclick="toggleAtRisk()">At Risk Only</button>
            <button class="fs-btn" onclick="exportCSV()">↓ Export CSV</button>
          </div>
        </div>

        <!-- Grid note -->
        <div id="grid-note" class="grid-note" style="display:none"></div>

        <!-- Stats strip -->
        <div class="stats-strip" id="stats-strip"></div>

        <!-- Legend -->
        <div class="legend">
          <div class="leg"><div class="leg-dot" style="background:var(--primary);"></div> Attended / Complete</div>
          <div class="leg"><div class="leg-dot" style="background:rgba(239,68,68,.18);border:2px solid rgba(239,68,68,.3);"></div> Not yet</div>
        </div>

        <!-- Table -->
        <div class="tbl-outer">
          <table id="progress-table">
            <thead id="tbl-head"></thead>
            <tbody id="tbl-body"></tbody>
          </table>
        </div>

        <div id="grid-msg" style="padding:0 18px 10px"></div>
      </div>

    </div>
  </main>

  <script>
  function readRuntimeConfig() {
    const cfg = window.FSConfig?.get ? window.FSConfig.get() : {
      SUPABASE_URL: String(window.FS_CONFIG?.SUPABASE_URL || '').trim(),
      SUPABASE_ANON_KEY: String(window.FS_CONFIG?.SUPABASE_ANON_KEY || '').trim(),
    };
    return {
      SUPABASE_URL: String(cfg.SUPABASE_URL || "").trim(),
      SUPABASE_ANON_KEY: String(cfg.SUPABASE_ANON_KEY || "").trim(),
    };
  }
  const CLASS_COLUMNS = ['Class1','Class2','Class3','Class4A','Class4B','Class5','Class6','Class7'];
  const VIEW_KEY = 'fs_progress_view';
  const state = { teacher:null, teachers:[], classes:[], classOptionId:'', students:[], filtered:[], milestones:[], progressView:'classes', atRiskOnly: false };
  const teacherModeScope = (() => {
    try {
      const raw = sessionStorage.getItem("fs_teacher_mode_scope");
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (String(parsed?.mode || "").toLowerCase() !== "teacher") return null;
      return parsed;
    } catch (_) { return null; }
  })();

  function esc(s){ return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function normFaith(v){ const t = String(v||'').trim(); return t || "I'm not sure"; }
  function faithBadgeClass(kind, value) {
    const v = normFaith(value);
    if (v === 'Yes') return 'fs-badge--success';
    if (v === 'No') return kind === 'water' ? 'fs-badge--danger' : 'fs-badge--warning';
    return 'fs-badge--neutral';
  }

  function showRuntimeError(message){
    const root = document.querySelector(".panel");
    if (!root || document.getElementById("progress-runtime-error")) return;
    const el = document.createElement("div");
    el.id = "progress-runtime-error";
    el.className = "error-msg";
    el.textContent = message;
    root.appendChild(el);
  }

  function ensureSupabaseClient() {
    if (window.FS_SUPABASE_CLIENT && typeof window.FS_SUPABASE_CLIENT.from === "function") return window.FS_SUPABASE_CLIENT;
    throw new Error("Supabase client is not initialized.");
  }
  async function apiGet(action, params={}) {
    ensureSupabaseClient();
    const res = await window.FSApi.invokeEdge("teacher-portal-api", { action, params });
    if(!res?.ok) throw new Error(res?.error || "Request failed");
    return res;
  }

  // -- TEACHER SEARCH --
  let tmr = null;
  function onTeacherInput() {
    clearTimeout(tmr);
    const q = document.getElementById('teacherQuery').value.trim();
    hideDrop();
    if (q.length < 2) return;
    tmr = setTimeout(() => searchTeacher(q), 220);
  }

  async function searchTeacher(q) {
    try {
      const r = await apiGet('lookupTeacherForAttendance', { query:q });
      state.teachers = (r.data || []).filter((t) => {
        if (!teacherModeScope?.teacherId) return true;
        return String(t.teacherId || "").trim() === String(teacherModeScope.teacherId || "").trim();
      });
      const drop = document.getElementById('teacherDrop');
      if (!state.teachers.length) { drop.innerHTML = '<div class="drop-item" style="color:var(--muted)">No matches</div>'; drop.classList.remove('hidden'); return; }
      drop.innerHTML = state.teachers.map(t =>
        `<div class="drop-item" onclick="pickTeacher('${esc(t.teacherId)}')">
          ${esc(t.fullName)}
          <div class="drop-item-sub">${esc(t.email||'')} ${esc(t.subGroupLabel||'')}</div>
        </div>`).join('');
      drop.classList.remove('hidden');
    } catch(e) { console.error(e); }
  }

  function hideDrop() { document.getElementById('teacherDrop').classList.add('hidden'); }
  document.addEventListener('click', e => { if (!e.target.closest('.dropdown')) hideDrop(); });

  async function pickTeacher(id) {
    state.teacher = state.teachers.find(t => t.teacherId===id);
    document.getElementById('teacherQuery').value = state.teacher?.fullName || '';
    hideDrop();
    // Load classes
    const sel = document.getElementById('classSelect');
    sel.innerHTML = '<option value="">Loading…</option>';
    sel.disabled = true;
    document.getElementById('loadBtn').disabled = true;
    try {
      const r = await apiGet('getTeacherActiveClassOptions', { teacherId: state.teacher.teacherId });
      state.classes = r.data || [];
      sel.innerHTML = state.classes.map(c =>
        `<option value="${esc(c.classOptionId)}">${esc(c.campus||c.fellowship||c.classOptionId)} | ${esc(c.day)} ${esc(c.time)}</option>`
      ).join('') || '<option value="">No assigned classes yet</option>';
      sel.disabled = false;
      document.getElementById('loadBtn').disabled = false;
      state.classOptionId = state.classes[0]?.classOptionId || '';
      sel.value = state.classOptionId;
    } catch(e) {
      sel.innerHTML = '<option value="">Error loading classes</option>';
    }
  }

  // -- LOAD GRID --
  async function loadGrid() {
    state.classOptionId = document.getElementById('classSelect').value;
    if (!state.teacher || !state.classOptionId) {
      document.getElementById('setup-error').innerHTML = '<div class="error-msg">Please select a teacher and class.</div>';
      return;
    }
    document.getElementById('setup-error').innerHTML = '';

    const card = document.getElementById('grid-card');
    card.classList.remove('hidden');
    document.getElementById('tbl-head').innerHTML = '';
    document.getElementById('tbl-body').innerHTML = `<tr><td colspan="10" class="state-msg"><div class="spinner"></div>Loading students…</td></tr>`;
    document.getElementById('stats-strip').innerHTML = '';
    document.getElementById('grid-msg').innerHTML = '';

    try {
      const r = await apiGet('getTeacherClassProgressGrid', {
        teacherId: state.teacher.teacherId,
        classOptionId: state.classOptionId
      });
      state.milestones = Array.isArray(r.data?.milestones) ? r.data.milestones : [];
      state.classes = Array.isArray(r.data?.classes) && r.data.classes.length ? r.data.classes : CLASS_COLUMNS;
      state.students = (r.data?.students || []);
      state.filtered = [...state.students];
      if (state.progressView !== 'classes' && state.progressView !== 'milestones') {
        state.progressView = 'classes';
      }
      syncViewUI();
      renderTable();
      card.scrollIntoView({behavior:'smooth', block:'start'});
    } catch(e) {
      document.getElementById('tbl-body').innerHTML = '';
      document.getElementById('grid-msg').innerHTML = `<div class="error-msg">${esc(e.message)}</div>`;
    }
  }

  // -- RENDER --
  function renderTable() {
    const rows = state.filtered;
    const isClasses = state.progressView === 'classes';
    const milestoneCols = state.milestones || [];
    const classCols = state.classes || CLASS_COLUMNS;
    const activeCols = isClasses ? classCols : milestoneCols.map((m) => m.code);
    const colCount = activeCols.length + 2;
    const note = document.getElementById('grid-note');
    if (note) {
      note.style.display = isClasses ? 'block' : 'none';
      note.textContent = "Attendance is recorded via the Attendance portal";
    }

    // Build header: group row + column labels
    document.getElementById('tbl-head').innerHTML = `
      <tr class="group-row">
        <th class="name-col"></th>
        <th colspan="${activeCols.length}" style="text-align:center;letter-spacing:.1em">${isClasses ? 'Classes' : 'Milestones'}</th>
        <th></th>
      </tr>
      <tr>
        <th class="name-col">Student</th>
        ${(isClasses
          ? classCols.map(c => `<th class="session-hdr">${esc(c)}</th>`)
          : milestoneCols.map(m => `<th class="session-hdr">${esc(m.label || m.code)}</th>`)).join('')}
        <th style="padding:10px 14px 10px 8px;min-width:100px;text-align:left">Progress</th>
      </tr>`;

    if (!rows.length) {
      document.getElementById('tbl-body').innerHTML = `<tr><td colspan="${colCount}" class="state-msg">No students found.</td></tr>`;
      renderStats([]);
      return;
    }

    document.getElementById('tbl-body').innerHTML = rows.map((s, rowIndex) => {
      const checks = isClasses
        ? classCols.map(c => !!(s.attendance || {})[c])
        : milestoneCols.map(m => !!(s.milestones || {})[m.code]);
      const attended = checks.filter(Boolean).length;
      const pct = activeCols.length ? Math.round(attended / activeCols.length * 100) : 0;
      return `<tr>
        <td class="name-col">
          <div class="student-name">${esc(s.fullName||'-')}</div>
          <div class="student-id">${esc(s.studentId||s.personType||'')}</div>
          <div class="faith-badges">
            <span class="fs-badge ${faithBadgeClass('born', s.bornAgain)}">Born Again: ${esc(normFaith(s.bornAgain))}</span>
            <span class="fs-badge ${faithBadgeClass('tongues', s.speaksInTongues)}">Tongues: ${esc(normFaith(s.speaksInTongues))}</span>
            <span class="fs-badge ${faithBadgeClass('water', s.waterBaptized)}">Baptized: ${esc(normFaith(s.waterBaptized))}</span>
          </div>
        </td>
        ${checks.map((on, idx) => `
          <td class="cb-cell">
            <button type="button" class="cb ${on?'checked':'unchecked'}" ${isClasses ? 'disabled' : ''} onclick="${isClasses ? '' : `toggleMilestone(${rowIndex}, ${idx})`}" aria-label="${isClasses ? 'Attendance status' : 'Toggle milestone'}">
              <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
                <path d="M1 4L4 7.5L10 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </td>`).join('')}
        <td style="padding:8px 14px 8px 8px">
          <div class="prog-wrap">
            <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
            <div class="prog-pct">${pct}%</div>
          </div>
        </td>
      </tr>`;
    }).join('');

    renderStats(rows);
  }

  function renderStats(rows) {
    const isClasses = state.progressView === 'classes';
    const milestoneCols = state.milestones || [];
    const classCols = state.classes || CLASS_COLUMNS;
    const activeCols = isClasses ? classCols : milestoneCols.map((m) => m.code);
    const total = rows.length;
    let totalChecks = 0, possibleChecks = total * activeCols.length;
    rows.forEach((s) => {
      if (isClasses) {
        classCols.forEach((c) => { if ((s.attendance || {})[c]) totalChecks++; });
      } else {
        milestoneCols.forEach((m) => { if ((s.milestones || {})[m.code]) totalChecks++; });
      }
    });
    const overallPct = possibleChecks ? Math.round(totalChecks / possibleChecks * 100) : 0;

    const perSession = isClasses
      ? classCols.map(c => rows.filter(s => !!(s.attendance || {})[c]).length)
      : milestoneCols.map(m => rows.filter(s => !!(s.milestones || {})[m.code]).length);

    const items = [
      `${total} students`,
      `${overallPct}% ${isClasses ? 'attendance' : 'milestones'}`,
      ...(isClasses
        ? classCols.map((c, i) => `${perSession[i]} ${c}`)
        : milestoneCols.map((m, i) => `${perSession[i]} ${String(m.label || m.code)}`))
    ];
    document.getElementById('stats-strip').innerHTML = `
      <div class="stats-inline">
        ${items.map((item, i) => `${i ? '<span class="sep">|</span>' : ''}<span>${esc(item)}</span>`).join('')}
      </div>
    `;
  }

  async function toggleMilestone(rowIndex, milestoneIndex) {
    if (state.progressView === 'classes') return;
    const student = state.filtered[rowIndex];
    const milestone = (state.milestones || [])[milestoneIndex];
    if (!student || !milestone) return;

    student.milestones = student.milestones || {};
    const previous = !!student.milestones[milestone.code];
    const next = !previous;

    student.milestones[milestone.code] = next;
    renderTable();
    document.getElementById('grid-msg').innerHTML = '';

    try {
      await apiGet('updateStudentMilestone', {
        studentId: student.studentId,
        milestoneCode: milestone.code,
        completed: next
      });
    } catch (e) {
      student.milestones[milestone.code] = previous;
      renderTable();
      document.getElementById('grid-msg').innerHTML = `<div class="error-msg">${esc(e.message || 'Could not save milestone update')}</div>`;
    }
  }

  // -- FILTER --
  function toggleAtRisk() {
    state.atRiskOnly = !state.atRiskOnly;
    const chip = document.getElementById('atRiskChip');
    if (chip) chip.classList.toggle('active', state.atRiskOnly);
    filterTable();
  }

  function filterTable() {
    const q = document.getElementById('studentSearch').value.toLowerCase();
    const classCols = state.classes || CLASS_COLUMNS;
    state.filtered = state.students.filter(s => {
      if (q && !(s.fullName||'').toLowerCase().includes(q) && !(s.studentId||'').toLowerCase().includes(q)) return false;
      if (state.atRiskOnly) {
        const attended = classCols.filter(c => !!(s.attendance || {})[c]).length;
        const pct = classCols.length ? Math.round(attended / classCols.length * 100) : 0;
        if (pct >= 75) return false;
      }
      return true;
    });
    renderTable();
  }

  // -- EXPORT CSV --
  function exportCSV() {
    const isClasses = state.progressView === 'classes';
    const milestoneCols = state.milestones || [];
    const classCols = state.classes || CLASS_COLUMNS;
    const headers = ['StudentID','Name', ...(isClasses ? classCols : milestoneCols.map(m => m.code)), 'Attended','Total','Pct'];
    const rows = state.filtered.map(s => {
      const checks = isClasses
        ? classCols.map(c => (s.attendance || {})[c] ? '1' : '0')
        : milestoneCols.map(m => (s.milestones || {})[m.code] ? '1' : '0');
      const attended = checks.filter(v=>v==='1').length;
      const total = (isClasses ? classCols.length : milestoneCols.length) || 0;
      return [s.studentId||'', s.fullName||'', ...checks, attended, total, (total ? Math.round(attended/total*100) : 0)+'%'].join(',');
    });
    const csv = [headers.join(','), ...rows].join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
    a.download = `student-progress-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  }

  function syncViewUI() {
    const classesBtn = document.getElementById('toggle-classes');
    const milestonesBtn = document.getElementById('toggle-milestones');
    if (!classesBtn || !milestonesBtn) return;
    classesBtn.classList.toggle('active', state.progressView === 'classes');
    milestonesBtn.classList.toggle('active', state.progressView === 'milestones');
  }

  function setProgressView(view) {
    state.progressView = view === 'milestones' ? 'milestones' : 'classes';
    try { localStorage.setItem(VIEW_KEY, state.progressView); } catch (_) {}
    syncViewUI();
    renderTable();
  }

  function setView(view) {
    setProgressView(view);
  }

  try {
    const savedView = localStorage.getItem(VIEW_KEY);
    if (savedView === 'classes' || savedView === 'milestones') {
      state.progressView = savedView;
    }
  } catch (_) {}
  </script>

  <script src="../js/config.js"></script>
  <script src="../js/config-helper.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/runtime.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api-client.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/admin-shell.js?v=20260518"></script>
  <script type="module">
    import { supabase, getCurrentProfile, isAdmin, isRegionalSecretary } from "../auth/auth-client.js";
    window.FS_SUPABASE_CLIENT = supabase;
    window["supabase"] = supabase;

    const { data } = await supabase.auth.getSession();
    if (!data?.session) {
      window.location.href = "login.html";
    } else {
      const profile = await getCurrentProfile();
      if (!profile || !(isAdmin(profile.role) || isRegionalSecretary(profile.role))) {
        window.location.href = "login.html";
      }
    }
  </script>
  <script type="module">
    import { supabase } from "../auth/auth-client.js";
    window.FSAdminShell && window.FSAdminShell.mount({ active: "progress", pageTitle: "Student Progress" });
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const teacherId = String(teacherModeScope?.teacherId || params.get('teacherId') || '');
      let email = String(teacherModeScope?.email || params.get('email') || '');
      let displayName = '';
      if (supabase && supabase.auth && typeof supabase.auth.getSession === 'function') {
        try {
          const { data } = await supabase.auth.getSession();
          const user = data?.session?.user;
          if (!email) email = user?.email || '';
          displayName = String(user?.user_metadata?.full_name || '').trim() || String(user?.email || '').trim();
        } catch (_) {}
      }
      if (window.FSAdminShell && typeof window.FSAdminShell.setProfile === 'function' && displayName) {
        window.FSAdminShell.setProfile(displayName, displayName.charAt(0).toUpperCase());
      }
      const seed = teacherId || email;
      if (!seed) return;
      const input = document.getElementById('teacherQuery');
      if (input) {
        input.value = seed;
        if (teacherModeScope?.teacherId) input.readOnly = true;
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
      }
    })();
  </script>
