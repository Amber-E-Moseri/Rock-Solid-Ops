<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Solid - Milestones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../ui/premium-theme.css" />
  <link rel="stylesheet" href="../ui/admin-shell.css" />
  <link rel="stylesheet" href="../ui/primitives.css" />
  <style>
    :root {
      --line: #e9e1f4;
      --shadow-soft: 0 10px 26px rgba(40, 26, 76, 0.06);
      --ink-soft: #716a88;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Manrope", sans-serif;
      color: var(--text);
      background:
        radial-gradient(880px 380px at 100% -12%, rgba(244, 190, 65, 0.08), transparent 66%),
        radial-gradient(760px 340px at 0% -10%, rgba(76, 42, 146, 0.08), transparent 68%),
        var(--bg);
    }
    .canvas { padding: 10px 8px 28px; }
    .page-head { margin-bottom: 22px; }
    .page-head h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 3vw, 3rem);
      line-height: 1;
      letter-spacing: -0.04em;
      font-weight: 800;
      color: #1b1530;
    }
    .page-head p {
      margin: 0;
      max-width: 760px;
      font-size: 15px;
      line-height: 1.55;
      color: var(--ink-soft);
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin: 22px 0 26px;
    }
    .summary-card {
      min-height: 104px;
      padding: 20px 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255,255,255,0.9);
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
    }
    .summary-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: var(--accent, #4c2a92);
    }
    .summary-card[data-tone="green"] { --accent: #16a34a; }
    .summary-card[data-tone="amber"] { --accent: #d97706; }
    .summary-card[data-tone="red"] { --accent: #ef4444; }
    .summary-value {
      font-size: 3rem;
      line-height: 0.95;
      font-weight: 800;
      letter-spacing: -0.05em;
      color: var(--accent, #4c2a92);
    }
    .summary-label {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #696281;
    }
    .content-grid {
      display: grid;
      grid-template-columns: 450px minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255,255,255,0.9);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 22px 24px 18px;
      border-bottom: 1px solid var(--line);
    }
    .panel-head h2 {
      margin: 0;
      font-size: 1.12rem;
      line-height: 1.2;
      font-weight: 800;
      color: #1b1530;
    }
    .panel-body { padding: 18px 22px 22px; }
    .journey-list {
      display: grid;
      gap: 14px;
      margin-bottom: 16px;
    }
    .journey-item {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 16px 16px 16px 14px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
    }
    .step-no {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #efe8ff;
      color: #5a36a6;
      font-weight: 800;
      font-size: 17px;
    }
    .step-title {
      font-size: 16px;
      font-weight: 700;
      color: #1c1631;
    }
    .step-desc {
      margin-top: 4px;
      font-size: 13px;
      line-height: 1.5;
      color: #716a88;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .badge.required {
      background: #ffeceb;
      color: #f0493e;
    }
    .badge.optional {
      background: #f4f1fb;
      color: #827a97;
    }
    .add-btn {
      width: 100%;
      height: 48px;
      border: 1px dashed #ddd3ef;
      border-radius: 18px;
      background: #fbf9fe;
      color: #6f6786;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .add-btn:hover { background: #f7f2fd; }
    .table-top {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 18px;
    }
    .class-filter {
      min-width: 180px;
      height: 44px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      color: #1b1530;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
    }
    .table-wrap { overflow: auto; }
    table {
      width: 100%;
      min-width: 860px;
      border-collapse: separate;
      border-spacing: 0;
    }
    thead th {
      padding: 0 12px 14px;
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #756f8d;
      border-bottom: 1px solid var(--line);
      font-weight: 800;
    }
    thead th.metric-col,
    tbody td.metric-col { text-align: center; width: 84px; }
    thead th.percent-col,
    tbody td.percent-col { text-align: right; width: 110px; }
    tbody td {
      padding: 16px 12px;
      border-bottom: 1px solid #ece5f4;
      vertical-align: middle;
      background: rgba(255,255,255,0.92);
    }
    tbody tr:last-child td { border-bottom: 0; }
    .student-cell {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .student-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #efe8ff;
      color: #5a36a6;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .student-name {
      font-size: 15px;
      font-weight: 700;
      color: #1c1631;
      line-height: 1.2;
    }
    .student-meta {
      margin-top: 4px;
      font-size: 13px;
      color: #6f6885;
    }
    .check {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #e4dbf2;
      background: #fff;
      color: transparent;
      cursor: pointer;
      font-size: 16px;
      font-weight: 800;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .check.done {
      border-color: #18a34a;
      background: #18a34a;
      color: #fff;
      box-shadow: 0 10px 18px rgba(24, 163, 74, 0.18);
    }
    .check:hover { transform: translateY(-1px); }
    .percent {
      font-size: 17px;
      font-weight: 800;
      color: #13111f;
    }
    .percent.good { color: #14924f; }
    .state {
      padding: 24px;
      text-align: center;
      color: #6f6885;
      font-size: 14px;
      background: rgba(255,255,255,0.78);
      border: 1px dashed #e6dff3;
      border-radius: 18px;
    }
    .flash {
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 14px;
      border: 1px solid #e7ddf7;
      background: #f7f3ff;
      color: #5a36a6;
    }
    .flash.bad {
      background: #fff1f2;
      border-color: #ffd6da;
      color: #d53e4f;
    }
    .hidden { display: none !important; }
    @media (max-width: 1240px) {
      .content-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 900px) {
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .canvas { padding-inline: 0; }
      .summary-grid { grid-template-columns: 1fr; }
      .journey-item { grid-template-columns: 40px minmax(0, 1fr); }
      .journey-item .badge { grid-column: 2; justify-self: start; }
      .table-top { justify-content: stretch; }
      .class-filter { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="main">
    <div class="canvas">
      <section class="page-head">
        <h1>Milestones</h1>
        <p>Define the Foundation School journey and track each student's completion across classes.</p>
      </section>

      <section id="flash" class="hidden"></section>

      <section class="summary-grid">
        <article class="summary-card" data-tone="purple">
          <div id="kMiles" class="summary-value">0</div>
          <div class="summary-label">Milestones defined</div>
        </article>
        <article class="summary-card" data-tone="green">
          <div id="kComplete" class="summary-value">0</div>
          <div class="summary-label">Fully complete</div>
        </article>
        <article class="summary-card" data-tone="amber">
          <div id="kAverage" class="summary-value">0%</div>
          <div class="summary-label">Avg completion</div>
        </article>
        <article class="summary-card" data-tone="red">
          <div id="kZero" class="summary-value">0</div>
          <div class="summary-label">Zero progress</div>
        </article>
      </section>

      <section class="content-grid">
        <article class="panel">
          <div class="panel-head">
            <h2>Milestone journey</h2>
          </div>
          <div class="panel-body">
            <div id="journeyList" class="journey-list"></div>
            <button id="defSaveBtn" class="add-btn">+ Add milestone</button>

            <div class="hidden">
              <input id="defCode" />
              <input id="defLabel" />
              <input id="defSession" />
              <select id="defActive"><option value="true">Active</option><option value="false">Inactive</option></select>
              <span id="defsRoleNote"></span>
              <div id="defsManage"></div>
              <div id="defRows"></div>
            </div>
          </div>
        </article>

        <article class="panel">
          <div class="panel-head">
            <h2>Student completion</h2>
          </div>
          <div class="panel-body">
            <div class="table-top">
              <select id="classFilter" class="class-filter">
                <option value="">All classes</option>
              </select>
            </div>
            <div id="tableState" class="state">Loading students...</div>
            <div id="tableWrap" class="table-wrap hidden">
              <table>
                <thead>
                  <tr id="tableHeadRow">
                    <th>Student</th>
                    <th class="percent-col">%</th>
                  </tr>
                </thead>
                <tbody id="rows"></tbody>
              </table>
            </div>
          </div>
        </article>
      </section>

      <section id="timelinePanel" class="hidden"></section>

      <input id="searchInput" class="hidden" />
      <select id="fellowshipFilter" class="hidden"><option value="">All Fellowships</option></select>
      <select id="milestoneFilter" class="hidden"><option value="">All Milestones</option></select>
      <select id="statusFilter" class="hidden"><option value="">All Statuses</option><option value="completed">Has progress</option><option value="pending">No progress</option></select>
      <div id="timeline" class="hidden"></div>
      <span id="rowMeta" class="hidden"></span>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/config-helper.js"></script>
  <script src="../js/admin-shell.js?v=20260518"></script>
  <script type="module">
    import { CONFIG, supabase, requireAuth, isRegionalSecretary } from "../auth/auth-client.js";

    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? "").replace(/[&<>'"]/g, (char) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;" }[char]));
    const state = {
      auth: null,
      applicants: [],
      classOptions: [],
      milestoneDefs: [],
      milestoneStatus: [],
      audits: [],
      filters: { search: "", fellowship: "", classOption: "", milestone: "", status: "" },
      selectedApplicantId: null,
      milestonesReady: true,
      isSuperadmin: false,
      canManageDefinitions: false,
      editingDefCode: null
    };

    function showFlash(message, bad = false) {
      const node = $("flash");
      if (!message) {
        node.className = "hidden";
        node.innerHTML = "";
        return;
      }
      node.className = `flash${bad ? " bad" : ""}`;
      node.textContent = message;
    }

    function setTableState(message) {
      $("tableState").textContent = message;
      $("tableState").classList.remove("hidden");
      $("tableWrap").classList.add("hidden");
    }

    function showTable() {
      $("tableState").classList.add("hidden");
      $("tableWrap").classList.remove("hidden");
    }

    function getDefByCode(code) {
      return state.milestoneDefs.find((item) => String(item.code) === String(code));
    }

    function statusesForApplicant(applicantId) {
      return state.milestoneStatus.filter((item) => String(item.applicant_id || item.student_id || "") === String(applicantId));
    }

    function isCompleted(item) {
      return String(item.status || "pending") === "completed";
    }

    function completedCodes(applicantId) {
      return new Set(statusesForApplicant(applicantId).filter(isCompleted).map((item) => String(item.milestone_code || "")));
    }

    function activeDefinitions() {
      return state.milestoneDefs
        .filter((item) => item.is_active !== false)
        .sort((a, b) => {
          const aOrder = a.sort_order ?? a.class_session_number ?? Number.MAX_SAFE_INTEGER;
          const bOrder = b.sort_order ?? b.class_session_number ?? Number.MAX_SAFE_INTEGER;
          return aOrder - bOrder;
        });
    }

    function applicantInitials(name) {
      const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
      return (parts.map((part) => part[0]).join("").slice(0, 2) || "?").toUpperCase();
    }

    function filteredApplicants() {
      return state.applicants.filter((applicant) => {
        const text = `${applicant.full_name || ""} ${applicant.email || ""}`.toLowerCase();
        const done = completedCodes(applicant.id);
        const defs = activeDefinitions();

        if (state.filters.search && !text.includes(state.filters.search.toLowerCase())) return false;
        if (state.filters.fellowship && String(applicant.fellowship_code || applicant.fellowship || applicant.subgroup_id || "") !== state.filters.fellowship) return false;
        if (state.filters.classOption && String(applicant.class_option_id || "") !== state.filters.classOption) return false;
        if (state.filters.milestone && !done.has(state.filters.milestone)) return false;
        if (state.filters.status === "completed" && !done.size) return false;
        if (state.filters.status === "pending" && done.size === defs.length) return false;
        return true;
      });
    }

    function buildFilterOptions() {
      const classValues = [...new Set(state.applicants.map((item) => String(item.class_option_id || "").trim()).filter(Boolean))].sort();
      const currentClass = $("classFilter").value;
      $("classFilter").innerHTML = `<option value="">All classes</option>` + classValues.map((value) => `<option value="${esc(value)}">${esc(value)}</option>`).join("");
      if (classValues.includes(currentClass)) $("classFilter").value = currentClass;
    }

    function renderJourneyList() {
      const defs = activeDefinitions();
      $("journeyList").innerHTML = defs.map((item, index) => `
        <article class="journey-item">
          <div class="step-no">${index + 1}</div>
          <div>
            <div class="step-title">${esc(item.label || item.code)}</div>
            <div class="step-desc">${esc(item.description || defaultDescription(item))}</div>
          </div>
          <span class="badge ${item.is_required === false ? "optional" : "required"}">${item.is_required === false ? "Optional" : "Required"}</span>
        </article>
      `).join("") || `<div class="state">No milestone definitions found.</div>`;
    }

    function defaultDescription(item) {
      if (item.class_session_number) return `Completed in class ${item.class_session_number}`;
      return String(item.code || "Milestone").replace(/_/g, " ").toLowerCase();
    }

    function renderTableHead(defs) {
      $("tableHeadRow").innerHTML = `
        <th>Student</th>
        ${defs.map((_, index) => `<th class="metric-col">${index + 1}</th>`).join("")}
        <th class="percent-col">%</th>
      `;
    }

    function renderRows() {
      const defs = activeDefinitions();
      const applicants = filteredApplicants();

      if (!defs.length) {
        setTableState("No milestone definitions are active yet.");
        $("rows").innerHTML = "";
        renderTableHead([]);
        updateSummary([]);
        return;
      }

      renderJourneyList();
      renderTableHead(defs);

      if (!applicants.length) {
        setTableState("No students match the selected class.");
        $("rows").innerHTML = "";
        updateSummary(defs);
        return;
      }

      $("rows").innerHTML = applicants.map((applicant) => {
        const done = completedCodes(applicant.id);
        const percentage = defs.length ? Math.round((done.size / defs.length) * 100) : 0;
        const classMeta = applicant.class_option_id || applicant.fellowship_code || applicant.fellowship || applicant.subgroup_id || "-";

        return `
          <tr>
            <td>
              <div class="student-cell">
                <div class="student-avatar">${esc(applicantInitials(applicant.full_name))}</div>
                <div>
                  <div class="student-name">${esc(applicant.full_name || "-")}</div>
                  <div class="student-meta">${esc(classMeta)}</div>
                </div>
              </div>
            </td>
            ${defs.map((def) => {
              const checked = done.has(def.code);
              return `<td class="metric-col"><button class="check ${checked ? "done" : ""}" data-app="${esc(applicant.id)}" data-code="${esc(def.code)}" aria-label="${checked ? "Completed" : "Pending"}">${checked ? "✓" : ""}</button></td>`;
            }).join("")}
            <td class="percent-col"><span class="percent ${percentage >= 100 ? "good" : ""}">${percentage}%</span></td>
          </tr>
        `;
      }).join("");

      document.querySelectorAll("[data-code]").forEach((button) => {
        button.addEventListener("click", () => toggleMilestone(button.dataset.app, button.dataset.code));
      });

      updateSummary(defs);
      showTable();
    }

    function updateSummary(defs) {
      const applicants = filteredApplicants();
      const fullyComplete = applicants.filter((applicant) => defs.length && completedCodes(applicant.id).size === defs.length).length;
      const zeroProgress = applicants.filter((applicant) => completedCodes(applicant.id).size === 0).length;
      const average = applicants.length && defs.length
        ? Math.round(applicants.reduce((sum, applicant) => sum + (completedCodes(applicant.id).size / defs.length), 0) / applicants.length * 100)
        : 0;

      $("kMiles").textContent = defs.length;
      $("kComplete").textContent = fullyComplete;
      $("kAverage").textContent = `${average}%`;
      $("kZero").textContent = zeroProgress;
    }

    async function toggleMilestone(applicantId, milestoneCode) {
      if (!state.milestonesReady) {
        showFlash("Milestones are not configured yet. Run migrations first.", true);
        return;
      }

      const existing = state.milestoneStatus.find((item) => String(item.applicant_id || "") === String(applicantId) && String(item.milestone_code || "") === String(milestoneCode));
      const nextCompleted = !(existing && isCompleted(existing));
      const now = new Date().toISOString();

      const payload = {
        applicant_id: String(applicantId),
        student_id: String(applicantId),
        milestone_code: String(milestoneCode),
        status: nextCompleted ? "completed" : "pending",
        completed_at: nextCompleted ? now : null,
        completed_by: nextCompleted ? (state.auth.profile.email || null) : null,
        updated_at: now,
        updated_by: state.auth.profile.email || null
      };

      const { error } = await supabase.from("student_milestone_status").upsert(payload, { onConflict: "applicant_id,milestone_code" });
      if (error) {
        showFlash(`Milestone update failed: ${error.message}`, true);
        return;
      }

      await supabase.from("audit_logs").insert({
        action: "MILESTONE_STATUS_UPDATED",
        entity_type: "student_milestone_status",
        entity_id: `${applicantId}:${milestoneCode}`,
        actor_email: state.auth.profile.email,
        status: "SUCCESS",
        details: { applicant_id: applicantId, milestone_code: milestoneCode, completed: nextCompleted },
        created_at: now
      });

      await loadData();
      showFlash("Milestone status updated.");
    }

    function startAddDefinition() {
      if (!state.canManageDefinitions) {
        showFlash("Your role can view milestones but cannot add new definitions.", true);
        return;
      }

      const label = window.prompt("Milestone label");
      if (!label) return;
      const code = String(label).trim().toUpperCase().replace(/[^A-Z0-9]+/g, "_").replace(/^_|_$/g, "");
      if (!code) return;
      $("defCode").value = code;
      $("defLabel").value = label.trim();
      $("defSession").value = activeDefinitions().length + 1;
      $("defActive").value = "true";
      saveDefinition();
    }

    async function saveDefinition() {
      if (!state.canManageDefinitions) return;

      const code = String($("defCode").value || "").trim().toUpperCase();
      const label = String($("defLabel").value || "").trim();
      const sessionRaw = String($("defSession").value || "").trim();
      const active = $("defActive").value === "true";

      if (!code || !label) {
        showFlash("Code and label are required.", true);
        return;
      }

      const classSessionNumber = sessionRaw ? Number(sessionRaw) : null;
      const payload = {
        code,
        label,
        class_session_number: Number.isFinite(classSessionNumber) ? classSessionNumber : null,
        is_active: active,
        is_required: true,
        sort_order: Number.isFinite(classSessionNumber) ? classSessionNumber : activeDefinitions().length + 1,
        updated_at: new Date().toISOString()
      };

      const { error } = await supabase.from("milestone_definitions").upsert(payload, { onConflict: "code" });
      if (error) {
        showFlash(`Definition save failed: ${error.message}`, true);
        return;
      }

      await loadData();
      showFlash("Milestone definition saved.");
    }

    async function loadData() {
      setTableState("Loading students...");

      const [apps, classes, defs, statuses, audits] = await Promise.all([
        supabase.from("applicants").select("*").limit(6000),
        supabase.from("class_options").select("*").limit(2000),
        supabase.from("milestone_definitions").select("*").order("sort_order", { ascending: true }),
        supabase.from("student_milestone_status").select("*").limit(30000),
        supabase.from("audit_logs").select("*").order("created_at", { ascending: false }).limit(1000)
      ]);

      if (apps.error || classes.error) {
        setTableState(apps.error?.message || classes.error?.message || "Failed to load data.");
        return;
      }

      state.milestonesReady = !(defs.error || statuses.error);
      state.applicants = apps.data || [];
      state.classOptions = classes.data || [];
      state.milestoneDefs = defs.error ? [] : (defs.data || []);
      state.milestoneStatus = statuses.error ? [] : (statuses.data || []);
      state.audits = audits.error ? [] : (audits.data || []);

      if (!state.milestonesReady) {
        showFlash("Milestone tables are not available yet. Apply migrations and refresh.", true);
      } else {
        showFlash("");
      }

      buildFilterOptions();
      renderJourneyList();
      renderRows();
    }

    function wire() {
      $("classFilter").addEventListener("change", (event) => {
        state.filters.classOption = event.target.value || "";
        renderRows();
      });
      $("defSaveBtn").addEventListener("click", startAddDefinition);
    }

    async function boot() {
      if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY || CONFIG.SUPABASE_URL.includes("YOUR-PROJECT-REF")) {
        showFlash("Supabase config missing in foundation/auth/auth-client.js.", true);
        setTableState("Supabase config missing.");
        return;
      }

      const auth = await requireAuth(["admin", "superadmin", "regional_secretary"]);
      if (!auth) return;
      if (!(["admin", "superadmin"].includes(String(auth.profile?.role || "").toLowerCase()) || isRegionalSecretary(auth.profile?.role))) return;

      state.auth = auth;
      state.isSuperadmin = String(auth.profile?.role || "").toLowerCase() === "superadmin";
      state.canManageDefinitions = ["superadmin", "admin", "regional_secretary"].includes(String(auth.profile?.role || "").toLowerCase());

      window.FSAdminShell?.mount({
        active: "milestones",
        pageTitle: "Milestones",
        role: auth.profile?.role,
        profileName: auth.profile?.full_name || auth.profile?.email || "Admin",
        breadcrumbs: [{ label: "Home", href: "dashboards.html" }, "Milestones"]
      });

      wire();
      await loadData();
    }

    boot().catch((error) => {
      showFlash(`Failed to load milestones: ${error.message || error}`, true);
      setTableState("Failed to load milestones.");
    });
  </script>
</body>
</html>
