<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Solid - Admin Activity Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../ui/premium-theme.css" />
  <link rel="stylesheet" href="../ui/admin-shell.css" />
  <link rel="stylesheet" href="../ui/components.css" />
  <link rel="stylesheet" href="../ui/layout.css" />
  <link rel="stylesheet" href="../ui/primitives.css" />
  <style>
    :root {
      --primary-hover: #7d62c8;
      --shadow-soft: 0 2px 8px rgba(0,0,0,.08);
      --shadow: 0 4px 16px rgba(0,0,0,.1);
      --shadow-pop: 0 8px 24px rgba(0,0,0,.14);
      --warning: var(--warn, #c07400);
      --warning-bg: var(--warn-bg, #fff8e6);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Manrope", sans-serif; color: var(--text); background: radial-gradient(900px 460px at 100% -12%, rgba(244,190,65,.10), transparent 65%), radial-gradient(760px 380px at -10% -6%, rgba(91,63,165,.08), transparent 64%), var(--bg); min-height: 100dvh; }
    .page-hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .page-hd h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px; }
    .page-hd-sub { color: var(--muted); font-size: 14px; font-weight: 500; margin: 0; }
    .page-hd-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .dash-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    @media (max-width: 700px) { .dash-kpis { grid-template-columns: repeat(2, 1fr); } }
    .dk { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow-soft); }
    .dv { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; color: var(--text); line-height: 1; }
    .dl { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-soft); overflow: hidden; margin-bottom: 16px; }
    .ph { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .ph h2 { font-size: 15px; font-weight: 800; margin: 0; }
    .panel-body { padding: 14px 18px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .actor-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 12px; margin-bottom: 20px; }
    .actor-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow-soft); }
    .actor-email { font-weight: 700; font-size: 14px; word-break: break-all; }
    .actor-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .actor-tag { display: inline-block; background: color-mix(in srgb,var(--primary) 10%,transparent); color: var(--primary); border-radius: 9999px; padding: 1px 8px; font-size: 11px; font-weight: 700; margin-top: 6px; }
    .status-success { color: var(--success); font-weight: 600; }
    .status-error   { color: var(--danger); font-weight: 600; }
    .status-pending { color: var(--warn); font-weight: 600; }
    .expand-btn { background: none; border: none; cursor: pointer; color: var(--primary); font-size: 12px; font-weight: 700; padding: 2px 6px; }
    .detail-row td { background: var(--surface-2); }
    .json-block { font-family: monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; max-height: 280px; overflow-y: auto; margin: 0; }
    .btn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; font: 600 13px/1.4 inherit; background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap; transition: background .12s, box-shadow .12s; }
    .btn:hover { background: var(--surface-2); box-shadow: var(--shadow-soft); }
    .btn-primary { background: linear-gradient(140deg, var(--primary-hover), var(--primary)); color: #fff; border-color: var(--primary); box-shadow: 0 4px 14px rgba(76,42,146,.22); }
    .btn-primary:hover { box-shadow: 0 6px 20px rgba(76,42,146,.32); }
    .msg { padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); font-size: 14px; }
    .msg.error { border-color: color-mix(in srgb,var(--danger) 30%,transparent); background: var(--danger-bg); color: var(--danger); }
    .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--muted); margin: 20px 0 8px; }
    /* JS-generated KPI cards map to dash-kpis design */
    .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow-soft); }
    .summary-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
    .summary-value { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; color: var(--text); line-height: 1; }
    .fs-table-wrap { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow-soft); }
    .fs-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .fs-table thead tr { background: var(--surface-2); }
    .fs-table th { padding: 10px 13px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--border); }
    .fs-table td { padding: 11px 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .fs-table tbody tr:last-child td { border-bottom: none; }
    .fs-table tbody tr:hover { background: color-mix(in srgb,var(--primary) 4%,transparent); }
  </style>
</head>
<body>
  <main class="fs-page fs-wrap-xl">
    <div class="page-hd">
      <div>
        <h1>Admin Activity Log</h1>
        <p class="page-hd-sub">Audit trail of all administrative actions across the system.</p>
      </div>
      <div class="page-hd-actions">
        <button id="exportBtn" class="btn">Export CSV</button>
        <button id="refreshBtn" class="btn">Refresh</button>
      </div>
    </div>

    <div class="dash-kpis" id="summaryGrid"></div>

    <div id="actorSection" style="display:none">
      <div class="section-label">Actor Summary (Last 30 Days)</div>
      <div class="actor-cards" id="actorCards"></div>
    </div>

    <div class="panel">
      <div class="toolbar">
        <input class="fs-input" id="actorInput" type="search" placeholder="Filter by actor email" style="flex:1;min-width:160px" />
        <select class="fs-select" id="actionFilter" style="width:auto"><option value="">All Actions</option></select>
        <select class="fs-select" id="entityFilter" style="width:auto">
          <option value="">All Entity Types</option>
          <option value="applicant">Applicant</option>
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
          <option value="batch">Batch</option>
          <option value="user">User</option>
          <option value="system">System</option>
        </select>
        <input class="fs-input" id="dateFrom" type="date" title="From date" style="width:140px" />
        <input class="fs-input" id="dateTo"   type="date" title="To date"   style="width:140px" />
        <button id="clearFiltersBtn" class="btn">Clear</button>
      </div>

      <div id="flashArea" style="padding:10px 16px"></div>

      <div style="overflow:auto">
        <table class="fs-table" id="activityTable">
          <thead>
            <tr>
              <th></th>
              <th>Time</th>
              <th>Actor</th>
              <th>Action</th>
              <th>Entity Type</th>
              <th>Entity ID</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div id="loadMore" style="text-align:center;padding:14px;display:none">
        <button class="btn" id="loadMoreBtn">Load more</button>
      </div>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/admin-shell.js?v=20260518"></script>
  <script type="module">
    import { supabase, requireAuth } from "../auth/auth-client.js";

    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? "").replace(/[&<>'"]/g, (m) => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[m]));
    const fmt = (v) => v ? new Date(v).toLocaleString("en-CA", { year:"numeric", month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" }) : "-";
    const fmtDate = (v) => v ? new Date(v).toLocaleDateString("en-CA", { year:"numeric", month:"short", day:"numeric" }) : "-";

    const PAGE_SIZE = 100;
    const state = {
      logs: [],
      filtered: [],
      profile: null,
      offset: 0,
      allLoaded: false,
    };

    function showFlash(msg, type = "") {
      $("flashArea").innerHTML = msg ? `<div class="msg ${type}">${esc(msg)}</div>` : "";
      if (msg && type !== "error") setTimeout(() => { $("flashArea").innerHTML = ""; }, 4000);
    }

    function getFilters() {
      return {
        actor:  ($("actorInput")?.value || "").toLowerCase().trim(),
        action: $("actionFilter")?.value || "",
        entity: $("entityFilter")?.value || "",
        from:   $("dateFrom")?.value || "",
        to:     $("dateTo")?.value || "",
      };
    }

    function applyFilters() {
      const f = getFilters();
      state.filtered = state.logs.filter((log) => {
        if (f.actor  && !(log.actor_email || "").toLowerCase().includes(f.actor)) return false;
        if (f.action && log.action !== f.action) return false;
        if (f.entity && (log.entity_type || "").toLowerCase() !== f.entity) return false;
        if (f.from && log.created_at < f.from) return false;
        if (f.to   && log.created_at.slice(0,10) > f.to) return false;
        return true;
      });
      renderTable();
    }

    function renderSummary() {
      const now   = new Date();
      const todayS = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
      const weekS  = new Date(now.getTime() - 7*86400000).toISOString();
      const monthS = new Date(now.getTime() - 30*86400000).toISOString();

      const today = state.logs.filter((l) => l.created_at >= todayS).length;
      const week  = state.logs.filter((l) => l.created_at >= weekS).length;
      const month = state.logs.filter((l) => l.created_at >= monthS).length;

      $("summaryGrid").innerHTML = [
        ["Today",       today],
        ["This Week",   week],
        ["This Month",  month],
        ["Total Loaded", state.logs.length],
      ].map(([lbl, val]) => `
        <article class="summary-card">
          <div class="summary-label">${esc(lbl)}</div>
          <div class="summary-value">${val}</div>
        </article>
      `).join("");
    }

    function renderActorCards() {
      const isSuperadmin = (state.profile?.role || "").toLowerCase() === "superadmin";
      const actorSection = $("actorSection");
      if (!isSuperadmin) { actorSection.style.display = "none"; return; }

      const cutoff = new Date(Date.now() - 30*86400000).toISOString();
      const recent = state.logs.filter((l) => l.created_at >= cutoff);
      const actorMap = new Map();
      for (const l of recent) {
        const key = l.actor_email || "system";
        const entry = actorMap.get(key) || { count: 0, last: null, actions: {} };
        entry.count++;
        if (!entry.last || l.created_at > entry.last) entry.last = l.created_at;
        entry.actions[l.action] = (entry.actions[l.action] || 0) + 1;
        actorMap.set(key, entry);
      }

      if (!actorMap.size) { actorSection.style.display = "none"; return; }
      actorSection.style.display = "block";

      const sorted = [...actorMap.entries()].sort((a, b) => b[1].count - a[1].count).slice(0, 12);
      $("actorCards").innerHTML = sorted.map(([email, d]) => {
        const topAction = Object.entries(d.actions).sort((a,b) => b[1]-a[1])[0]?.[0] || "-";
        return `<div class="actor-card">
          <div class="actor-email">${esc(email)}</div>
          <div class="actor-meta">${d.count} actions Â· last ${fmtDate(d.last)}</div>
          <span class="actor-tag">${esc(topAction)}</span>
        </div>`;
      }).join("");
    }

    function statusClass(s) {
      if (!s) return "";
      const sl = String(s).toLowerCase();
      if (sl === "success") return "status-success";
      if (sl === "error" || sl === "failed") return "status-error";
      return "status-pending";
    }

    function renderTable() {
      const tbody = $("tableBody");
      const rows  = state.filtered;

      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="7"><div class="msg">No activity records match the current filters.</div></td></tr>`;
        return;
      }

      tbody.innerHTML = rows.map((log, i) => {
        const detailId = `detail-${i}`;
        const hasDetail = log.details && Object.keys(log.details).length > 0;
        return `<tr class="log-row" data-idx="${i}">
          <td style="width:30px">${hasDetail ? `<button class="expand-btn" data-target="${detailId}" aria-expanded="false">+</button>` : ""}</td>
          <td style="font-size:12px;white-space:nowrap">${fmt(log.created_at)}</td>
          <td style="font-size:12px">${esc(log.actor_email || "system")}</td>
          <td style="font-size:12px;font-weight:600">${esc(log.action || "-")}</td>
          <td style="font-size:12px">${esc(log.entity_type || "-")}</td>
          <td style="font-size:12px;max-width:140px;overflow:hidden;text-overflow:ellipsis">${esc(log.entity_id || "-")}</td>
          <td><span class="${statusClass(log.status)}">${esc(log.status || "-")}</span></td>
        </tr>
        ${hasDetail ? `<tr id="${detailId}" class="detail-row" style="display:none">
          <td colspan="7"><pre class="json-block">${esc(JSON.stringify(log.details, null, 2))}</pre></td>
        </tr>` : ""}`;
      }).join("");
    }

    function populateActionDropdown() {
      const actions = [...new Set(state.logs.map((l) => l.action).filter(Boolean))].sort();
      $("actionFilter").innerHTML = '<option value="">All Actions</option>' +
        actions.map((a) => `<option value="${esc(a)}">${esc(a)}</option>`).join("");
    }

    async function loadLogs(append = false) {
      if (!append) { state.offset = 0; state.allLoaded = false; }
      showFlash("Loading...");

      const { data, error } = await supabase
        .from("audit_logs")
        .select("id,action,entity_type,entity_id,actor_email,status,details,created_at")
        .order("created_at", { ascending: false })
        .range(state.offset, state.offset + PAGE_SIZE - 1);

      if (error) { showFlash(`Load failed: ${error.message}`, "error"); return; }
      const rows = data || [];

      if (append) {
        state.logs = [...state.logs, ...rows];
      } else {
        state.logs = rows;
      }

      if (rows.length < PAGE_SIZE) {
        state.allLoaded = true;
        $("loadMore").style.display = "none";
      } else {
        state.offset += PAGE_SIZE;
        $("loadMore").style.display = "block";
      }

      if (!append) populateActionDropdown();
      renderSummary();
      renderActorCards();
      showFlash("");
      applyFilters();
    }

    function exportCsv() {
      const rows = state.filtered;
      if (!rows.length) return;
      const cols = ["created_at","actor_email","action","entity_type","entity_id","status"];
      const lines = [
        cols.join(","),
        ...rows.map((r) => cols.map((c) => `"${String(r[c] ?? "").replace(/"/g,'""')}"`).join(",")),
      ];
      const blob = new Blob([lines.join("\n")], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `audit-log-${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function bindEvents() {
      $("refreshBtn").addEventListener("click", () => loadLogs(false));
      $("exportBtn").addEventListener("click", exportCsv);
      $("clearFiltersBtn").addEventListener("click", () => {
        $("actorInput").value = "";
        $("actionFilter").value = "";
        $("entityFilter").value = "";
        $("dateFrom").value = "";
        $("dateTo").value = "";
        applyFilters();
      });
      $("loadMoreBtn").addEventListener("click", () => loadLogs(true));

      ["actorInput","actionFilter","entityFilter","dateFrom","dateTo"].forEach((id) => {
        const el = $(id);
        el && el.addEventListener("change", applyFilters);
        if (el?.tagName === "INPUT") el.addEventListener("input", applyFilters);
      });

      $("tableBody").addEventListener("click", (e) => {
        const btn = e.target.closest(".expand-btn");
        if (!btn) return;
        const targetId = btn.dataset.target;
        const detailRow = document.getElementById(targetId);
        if (!detailRow) return;
        const expanded = detailRow.style.display !== "none";
        detailRow.style.display = expanded ? "none" : "";
        btn.textContent = expanded ? "+" : "-";
        btn.setAttribute("aria-expanded", String(!expanded));
      });
    }

    async function boot() {
      if (!window.FS_CONFIG?.SUPABASE_URL) {
        window.FSAdminShell?.mount({ active: "adminactivity", pageTitle: "Admin Activity Log", profileName: "Not connected" });
        showFlash("Not connected â€” open via live server with config.js", "error");
        return;
      }
      const auth = await requireAuth(["admin", "superadmin"]);
      if (!auth) return;
      state.profile = auth.profile;

      window.FSAdminShell?.mount({ active: "adminactivity", pageTitle: "Admin Activity Log", role: auth.profile?.role });

      bindEvents();
      await loadLogs(false);
    }

    boot().catch((e) => showFlash(`Boot failed: ${esc(e?.message || e)}`, "error"));
  </script>
</body>
</html>
