# Netlify build for the SPA cutover.
#
# Publish is the allowlisted directory built by scripts/build-spa-publish.mjs.
# It is never the repository root. The security baseline is
# scripts/build-static-publish.mjs (origin/main), whose guards the build keeps.
# Redirects live only in foundation-spa/public/_redirects (copied to the publish
# root by Vite). Headers live only in the repository root _headers file (copied by the build).
#
# Required Netlify environment variables: SUPABASE_URL and SUPABASE_ANON_KEY (anon
# or publishable key only). BYPASS_ROLE and VITE_BYPASS_ROLE must NOT be set in
# any context; the build refuses.

[build]
  command = "npm --prefix foundation-spa ci && node scripts/build-spa-publish.mjs"
  publish = "netlify-static-publish"

[build.environment]
  NODE_VERSION = "22"
