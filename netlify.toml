# Netlify build for the isolated SPA preview.
#
# Publish is netlify-static-publish/, never the repository root.
# Step 1 is the origin/main baseline, unchanged: it publishes the static /foundation
# tree and _headers, and verifies them. Step 2 adds the SPA under /app/ and the
# production-compatible root _redirects, then verifies the combined output.
#
# Redirects live only in the root _redirects file. This file has no redirect blocks.
#
# Required Netlify environment variables: SUPABASE_URL and SUPABASE_ANON_KEY (anon
# or publishable key only). BYPASS_ROLE and VITE_BYPASS_ROLE must NOT be set in
# any context; the build refuses.

[build]
  command = "npm --prefix foundation-spa ci && node scripts/build-static-publish.mjs && node scripts/build-spa-publish.mjs"
  publish = "netlify-static-publish"

[build.environment]
  NODE_VERSION = "22"
